[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soc-triage-mcp"
version = "1.0.0"
description = "MCP server + agent for SOC incident triage: domain classification, OCSF normalisation, detection query, events, OSINT, ATT&CK mapping and summaries"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40", "openai>=1.66", "jsonschema>=4"]
dev = ["pytest>=8"]

[project.scripts]
soc-triage = "soc_triage.cli:main"
soc-triage-mcp = "soc_triage.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"soc_triage.data" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
